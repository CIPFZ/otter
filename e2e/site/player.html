<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otter player fixture</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/@otter-skin/index.css" />
    <style>
      body { margin: 0; padding: 16px; background: #10161e; color: #fff; font: 14px system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Otter player fixture</h1>
      <!-- tabindex=-1: the player root takes keyboard focus for hotkeys; the picture itself is not a
           control (Firefox would otherwise put the bare <video> in the tab order). -->
      <div id="player" data-otter-player role="region" aria-label="Video player" tabindex="-1">
        <video playsinline crossorigin="anonymous" tabindex="-1"></video>
        <otter-gesture></otter-gesture>
        <otter-poster></otter-poster>
        <otter-spinner></otter-spinner>
        <otter-stats hidden></otter-stats>
        <otter-announcer></otter-announcer>
        <div data-otter-controls>
          <otter-play-button></otter-play-button>
          <otter-mute-button></otter-mute-button>
          <otter-volume-slider></otter-volume-slider>
          <otter-time-slider></otter-time-slider>
          <otter-time-display></otter-time-display>
          <otter-live-indicator></otter-live-indicator>
          <otter-captions-button></otter-captions-button>
          <otter-settings-menu></otter-settings-menu>
          <otter-pip-button></otter-pip-button>
          <otter-fullscreen-button></otter-fullscreen-button>
        </div>
      </div>
      <p><label><input id="toggle-stats" type="checkbox" /> Stats for nerds</label></p>
    </main>
    <script type="module" src="./player.ts"></script>
  </body>
</html>
