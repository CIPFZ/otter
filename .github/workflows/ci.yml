name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly real-device matrix (runs only when device endpoints are configured).
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.11.2
  NODE_VERSION: 22

jobs:
  verify:
    name: typecheck · build · test · vendor records · boundaries · size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # pnpm is installed in the next step; automatic package-manager caching would run before it.
          package-manager-cache: false
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - name: Vendored source records
        run: pnpm check:vendor
      - name: Package boundaries
        run: pnpm check:boundaries
      - name: Strict TypeScript
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Top-level side effects
        run: pnpm check:side-effects
      - name: Engine libraries stay out of the first screen (ADR-004)
        run: pnpm check:engine-chunks
      - name: Size budgets
        run: |
          status=0
          pnpm exec size-limit --json > size-report.json || status=$?
          node scripts/size-report.ts size-report.json >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # Size sentinel (ADR-004): report-only entries (Hero until M6) warn when they grow > 0.5 KB
      # since the previous main run. The baseline travels through the Actions cache.
      - name: Restore size baseline
        uses: actions/cache/restore@v6
        with:
          path: .size-baseline.json
          key: size-baseline-${{ github.sha }}
          restore-keys: size-baseline-
      - name: Size sentinel
        if: always()
        run: node scripts/size-sentinel.ts size-report.json .size-baseline.json
      - name: Save size baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .size-baseline.json
          key: size-baseline-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            size-report.json
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium + firefox
            os: ubuntu-24.04
            browsers: chromium firefox
            projects: --project=desktop-chrome --project=desktop-firefox --project=emulated-android
          - name: webkit
            os: macos-15
            browsers: webkit
            projects: --project=desktop-safari --project=emulated-iphone
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # pnpm is installed in the next step; automatic package-manager caching would run before it.
          package-manager-cache: false
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      # Public streams (@network) are not deterministic; they run in network-nightly.
      - run: pnpm e2e ${{ matrix.projects }} --grep-invert "@network|@bench"
      # Benchmarks need the runner to themselves (one worker); they skip, with a notice, where the
      # runner is too small (e2e/multiview.spec.ts: 8+ cores).
      - if: matrix.name == 'chromium + firefox'
        run: pnpm e2e --project=desktop-chrome --grep @bench --workers=1
      # Per-environment facts the tests record (capabilities, refusals) as run-page notices.
      - name: Test notices
        if: always()
        # A step shows at most 10 notices (the measurements first): all of them also go to the job summary.
        run: |
          if [ -f test-results/ci-notices.txt ]; then
            KEY='surfaces|dvr|AudioContext resume'
            { grep -E "$KEY" test-results/ci-notices.txt; grep -vE "$KEY" test-results/ci-notices.txt; } | sed 's/^/::notice title=e2e::/'
            { echo '### e2e notices'; echo '```'; cat test-results/ci-notices.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report
          if-no-files-found: ignore
      # Background mode: time until the picture caught up with the clock (ADR-011 §4, 20 main runs).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: background-catch-up-${{ matrix.os }}
          path: test-results/background
          retention-days: 90
          if-no-files-found: ignore

  network-nightly:
    name: e2e @network (nightly)
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - id: run
        name: Public stream scenarios
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=network-results.json pnpm e2e --project=desktop-chrome --project=desktop-firefox --grep @network --reporter=line,json
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue (ADR-004 §3)
        if: steps.run.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/network-issue.ts network-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-network
          path: |
            playwright-report
            network-results.json
          if-no-files-found: ignore

  vendor-drift:
    name: vendored code drift report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Compare pinned commits with upstream (never blocks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/vendor-sync.ts --out vendor-sync-report.md > /dev/null; cat vendor-sync-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vendor-sync-report
          path: vendor-sync-report.md

  real-devices:
    name: e2e (real devices)
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      OTTER_REAL_IOS_WS_ENDPOINT: ${{ secrets.OTTER_REAL_IOS_WS_ENDPOINT }}
      OTTER_REAL_ANDROID_WS_ENDPOINT: ${{ secrets.OTTER_REAL_ANDROID_WS_ENDPOINT }}
      OTTER_REAL_TV_CDP_URL: ${{ secrets.OTTER_REAL_TV_CDP_URL }}
      OTTER_REAL_TV_PLATFORM: ${{ vars.OTTER_REAL_TV_PLATFORM }}
      OTTER_E2E_BASE_URL: ${{ secrets.OTTER_E2E_BASE_URL }}
    steps:
      - name: Check device endpoints
        id: endpoints
        run: |
          if [ -z "$OTTER_REAL_IOS_WS_ENDPOINT$OTTER_REAL_ANDROID_WS_ENDPOINT$OTTER_REAL_TV_CDP_URL" ]; then
            echo "::warning::No real-device endpoints configured; the real-device matrix did not run (AGENT §2.6)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.endpoints.outputs.configured == 'true'
      - uses: actions/setup-node@v7
        if: steps.endpoints.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - if: steps.endpoints.outputs.configured == 'true'
        run: npm install -g pnpm@${{ env.PNPM_VERSION }} && pnpm install --frozen-lockfile
      - if: steps.endpoints.outputs.configured == 'true'
        run: pnpm e2e --project='real-*'
      - uses: actions/upload-artifact@v7
        if: always() && steps.endpoints.outputs.configured == 'true'
        with:
          name: playwright-report-real-devices
          path: playwright-report
          if-no-files-found: ignore
