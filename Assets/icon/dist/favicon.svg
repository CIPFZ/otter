<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Otter symbol, transparent background, monochrome via currentColor.
    Use for favicon.svg with prefers-color-scheme, inline docs, and the "O" of the wordmark.
    Knock-out is done with a mask so it stays transparent.
  -->
  <style>@media (prefers-color-scheme: dark){g{color:#1EE9E6 !important}}</style><defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M150 736 C 260 690, 360 690, 470 736 S 680 782, 790 736 S 900 690, 1010 736" stroke-width="96"/>
        <path d="M300 822 C 390 786, 470 786, 560 822 S 730 858, 820 822" stroke-width="80"/>
      </g>
    </mask>
  </defs>
  <g fill="currentColor" stroke="currentColor" color="#12C9D4">
    <circle cx="512" cy="468" r="246" fill="none" stroke-width="108" mask="url(#cut)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 736 C 260 690, 360 690, 470 736 S 680 782, 790 736 S 900 690, 1010 736" stroke-width="46"/>
      <path d="M300 822 C 390 786, 470 786, 560 822 S 730 858, 820 822" stroke-width="34"/>
    </g>
    <path d="M458 380 L 640 468 L 458 556 Z" stroke-width="40" stroke-linejoin="round"/>
  </g>
</svg>
