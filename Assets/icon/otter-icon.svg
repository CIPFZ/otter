<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Otter app icon, master (64px and up).
    Palette: otter-bg #243447 / otter-accent #1EE9E6 / otter-accent-deep #12C9D4 / otter-fg #FFFFFF
    Geometry: ring center (512,468) outer r 300 inner r 192; waves knocked out of the ring with bg-colored strokes.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3C52"/>
      <stop offset="1" stop-color="#1E2D40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AF2EF"/>
      <stop offset="1" stop-color="#12C9D4"/>
    </linearGradient>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="228" ry="228"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- O ring -->
    <circle cx="512" cy="468" r="246" fill="none" stroke="url(#accent)" stroke-width="108"/>

    <!-- knock-out behind waves (bg color, wider than the waves) -->
    <g fill="none" stroke="#223246" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 736 C 260 690, 360 690, 470 736 S 680 782, 790 736 S 900 690, 1010 736" stroke-width="96"/>
      <path d="M300 822 C 390 786, 470 786, 560 822 S 730 858, 820 822" stroke-width="80"/>
    </g>

    <!-- waves -->
    <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 736 C 260 690, 360 690, 470 736 S 680 782, 790 736 S 900 690, 1010 736" stroke-width="46"/>
      <path d="M300 822 C 390 786, 470 786, 560 822 S 730 858, 820 822" stroke-width="34"/>
    </g>

    <!-- play triangle, optically centered (shifted right by 14) -->
    <path d="M458 380 L 640 468 L 458 556 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round"/>
  </g>
</svg>
